<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Word Prediction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Clean Minimalist Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="brand-title">Next Word Predictor</h1>
        <p class="brand-subtitle">Deep Learning LSTM Language Model</p>
      </div>
    </header>

    <!-- Main Clean Container -->
    <main class="main-content">
      <!-- Input & Suggestions Section -->
      <section class="editor-section">
        <div class="editor-box">
          <textarea 
            id="user-input" 
            placeholder="Type your sentence here..." 
            rows="4" 
            autofocus
            spellcheck="false"
          ></textarea>
          
          <div class="editor-footer">
            <div class="tab-hint">
              <kbd>Tab</kbd> to accept top prediction
            </div>
            <div class="editor-actions">
              <button id="btn-clear" class="btn-text" title="Clear">Clear</button>
              <button id="btn-generate" class="btn-primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <span>Continue Generating</span>
              </button>
            </div>
          </div>
        </div>


        <!-- Inline Suggestions Chips -->
        <div class="suggestions-card">
          <div class="card-top-row">
            <h2 class="section-heading">Suggested Next Words</h2>
            <span id="latency-badge" class="latency-pill hidden">0 ms</span>
          </div>
          
          <div id="candidate-chips" class="chips-container">
            <span class="empty-hint">Type above to see predictions in real time</span>
          </div>
        </div>
      </section>

      <!-- Clean Probability & Controls Section -->
      <aside class="sidebar-section">
        <!-- Probability Distribution -->
        <div class="side-card">
          <h2 class="section-heading">Prediction Confidence</h2>
          <div id="probabilities-container" class="prob-list">
            <div class="empty-prob">
              <p>Probabilities appear as you type.</p>
            </div>
          </div>
        </div>

        <!-- Minimal Settings -->
        <div class="side-card">
          <h2 class="section-heading">Parameters</h2>
          <div class="slider-group">
            <div class="slider-item">
              <div class="slider-header">
                <span>Top Candidates (K)</span>
                <span id="top-k-val" class="slider-val">5</span>
              </div>
              <input type="range" id="top-k-slider" min="1" max="10" value="5" step="1">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span>Temperature</span>
                <span id="temp-val" class="slider-val">1.0</span>
              </div>
              <input type="range" id="temp-slider" min="0.1" max="2.0" value="1.0" step="0.1">
            </div>

            <div class="slider-item">
              <div class="slider-header">
                <span>Generation Length</span>
                <span id="gen-len-val" class="slider-val">6</span>
              </div>
              <input type="range" id="gen-len-slider" min="2" max="20" value="6" step="1">
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
